<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Инвентаризация: Управление товарами</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('main.favicon') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
      :root {
          --primary-color: #D4AF37;
          --secondary-color: #2c3e50;
          --accent-color: #e8d5b7;
          --success-color: #2ecc71;
          --warning-color: #f39c12;
          --danger-color: #e74c3c;
          --dark-color: #2c3e50;
          --light-color: #f8f6f3;
          --gray-color: #95a5a6;
          --border-color: #e0d7ce;
          --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
          --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.12);
      }

      body {
          font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
          margin: 20px;
          background: var(--light-color);
          color: var(--dark-color);
      }

      .container {
          max-width: 1200px;
          margin: 0 auto;
          background: white;
          border-radius: 8px;
          overflow: hidden;
          box-shadow: var(--shadow-lg);
      }

      .header {
          background: linear-gradient(135deg, var(--secondary-color) 0%, #1a252f 100%);
          color: var(--primary-color);
          padding: 50px 20px;
          text-align: center;
          border-bottom: 3px solid var(--primary-color);
      }

      .header h1 {
          font-size: 2.2em;
          margin-bottom: 8px;
          font-weight: 700;
          letter-spacing: 1px;
      }

      .main {
          padding: 30px 20px;
      }

      h2 {
          color: var(--dark-color);
          margin-top: 20px;
          font-weight: 600;
      }

      table {
          width: 100%;
          border-collapse: collapse;
          margin: 20px 0;
          box-shadow: var(--shadow);
          border-radius: 6px;
          overflow: hidden;
      }

      th, td {
          padding: 14px;
          text-align: left;
          border: 1px solid var(--border-color);
      }

      th {
          background: var(--secondary-color);
          color: var(--primary-color);
          font-weight: 600;
          letter-spacing: 0.5px;
      }

      tr:nth-child(even) {
          background: var(--light-color);
      }

      tr:hover {
          background: var(--accent-color);
      }

      input[type="number"] {
          width: 60px;
          padding: 8px;
          border: 1px solid var(--border-color);
          border-radius: 4px;
          font-size: 14px;
          text-align: center;
      }

      .qty-controls {
          display: flex;
          align-items: center;
          gap: 5px;
      }

      .qty-btn {
          width: 36px;
          height: 36px;
          padding: 0;
          border: 2px solid;
          border-radius: 4px;
          cursor: pointer;
          font-size: 18px;
          font-weight: bold;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: all 0.2s ease;
          margin-bottom: 0;
      }

      .qty-btn-minus {
          background: #e74c3c;
          color: white;
          border-color: #c0392b;
      }

      .qty-btn-minus:hover {
          background: #c0392b;
          border-color: #a93226;
          transform: scale(1.05);
      }

      .qty-btn-plus {
          background: #2ecc71;
          color: white;
          border-color: #27ae60;
      }

      .qty-btn-plus:hover {
          background: #27ae60;
          border-color: #229954;
          transform: scale(1.05);
      }

      .qty-btn:active {
          transform: scale(0.95);
      }

      .qty-btn:disabled {
          opacity: 0.5;
          cursor: not-allowed;
      }

      .add-product-link {
          color: var(--primary-color);
          font-weight: 500;
          cursor: pointer;
          text-decoration: none;
          font-size: 15px;
      }

      .add-product-link:hover {
          text-decoration: underline;
      }

      button {
          padding: 12px 24px;
          margin: 8px;
          background: var(--primary-color);
          color: var(--dark-color);
          border: 2px solid var(--primary-color);
          border-radius: 6px;
          cursor: pointer;
          font-size: 14px;
          font-weight: 600;
          transition: all 0.3s ease;
      }

      button:hover {
          background: #e6a028;
          border-color: #e6a028;
          transform: translateY(-2px);
          box-shadow: var(--shadow-lg);
      }

      button:disabled {
          background: var(--gray-color);
          border-color: var(--gray-color);
          cursor: not-allowed;
      }

      .button-group {
          margin: 20px 0;
          display: flex;
          gap: 10px;
          flex-wrap: wrap;
      }

      .alert {
          padding: 15px;
          margin: 10px 0;
          border-radius: 6px;
          border-left: 4px solid;
      }

      .alert-success {
          background: #d4edda;
          color: #155724;
          border-left-color: var(--success-color);
      }

      .alert-error {
          background: #f8d7da;
          color: #721c24;
          border-left-color: var(--danger-color);
      }

      .alert-info {
          background: #d1ecf1;
          color: #0c5460;
          border-left-color: var(--secondary-color);
      }

      .alert-loading {
          background: #e7f3ff;
          color: #004085;
          border-left-color: var(--secondary-color);
      }

      #statusMessage {
          margin: 15px 0;
      }

      #inventTable {
          display: none;
          margin-top: 20px;
      }

      #commentsStage {
          display: none;
          margin-top: 30px;
      }

      #commentsStage h2 {
          margin-top: 0;
      }

      textarea {
          width: 100%;
          padding: 12px;
          border: 1px solid var(--border-color);
          border-radius: 4px;
          font-family: monospace;
          font-size: 13px;
          resize: vertical;
          background: white;
      }

      textarea:focus {
          outline: none;
          border-color: var(--primary-color);
          box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
      }

      .modal {
          display: none;
          position: fixed;
          z-index: 1000;
          left: 0;
          top: 0;
          width: 100%;
          height: 100%;
          background: rgba(0, 0, 0, 0.5);
          animation: fadeIn 0.3s ease;
      }

      .modal.active {
          display: flex;
          align-items: center;
          justify-content: center;
      }

      @keyframes fadeIn {
          from {
              opacity: 0;
          }
          to {
              opacity: 1;
          }
      }

      .modal-content {
          background: white;
          padding: 30px;
          border-radius: 12px;
          box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
          max-width: 500px;
          width: 90%;
          animation: slideUp 0.3s ease;
      }

      @keyframes slideUp {
          from {
              transform: translateY(20px);
              opacity: 0;
          }
          to {
              transform: translateY(0);
              opacity: 1;
          }
      }

      .modal-title {
          font-size: 18px;
          font-weight: 600;
          margin-bottom: 20px;
          color: var(--dark-color);
      }

      .modal-input {
          width: 100%;
          padding: 10px;
          margin: 10px 0;
          border: 1px solid var(--border-color);
          border-radius: 4px;
          font-size: 14px;
      }

      .modal-input:focus {
          outline: none;
          border-color: var(--primary-color);
          box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
      }

      .modal-buttons {
          display: flex;
          gap: 10px;
          margin-top: 20px;
      }

      .modal-buttons button {
          flex: 1;
          margin: 0;
      }

      .footer-link {
          text-align: center;
          margin-top: 30px;
          padding-top: 20px;
          border-top: 1px solid var(--border-color);
      }

      .footer-link a {
          color: var(--primary-color);
          text-decoration: none;
          font-weight: 500;
      }

      .footer-link a:hover {
          text-decoration: underline;
      }

      .edit-column {
          background: #fef5e7;
      }

      @media (max-width: 768px) {
          .header {
              padding: 30px 15px;
          }

          .main {
              padding: 15px;
          }

          button {
              padding: 10px 16px;
              font-size: 13px;
          }

          table {
              font-size: 13px;
          }

          th, td {
              padding: 10px;
          }

          input[type="number"] {
              width: 50px;
          }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1>📦 Инвентаризация</h1>
        <p style="margin: 10px 0 0; font-size: 14px; opacity: 0.9">Управление товарами без накладной</p>
      </header>

      <main class="main">
        <div id="statusMessage"></div>

        <!-- Таблица инвентаризации -->
        <section id="inventTable">
          <h2>Товары</h2>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>#</th>
                  <th>SKU</th>
                  <th>Название</th>
                  <th class="edit-column">Доставлено</th>
                </tr>
              </thead>
              <tbody id="inventTableBody">
                <tr id="addProductRow" style="background: #f9f9f9; border: 1px dashed var(--border-color)">
                  <td colspan="4" style="text-align: center; padding: 20px">
                    <span class="add-product-link" onclick="inventManager.showAddProductModal()">
                      ➕ Добавить товар
                    </span>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>

          <div class="button-group">
            <button onclick="inventManager.sendQuantities()" id="btnSendInvent" style="display: none; background: var(--primary-color)">
              📤 Отправить все
            </button>
            <button onclick="inventManager.resetAllToZero()" id="btnResetZero" style="display: none; background: var(--accent-color)">
              🔄 Обнулить поля
            </button>
          </div>
        </section>

        <!-- Этап комментариев (после отправки) -->
        <section id="commentsStage">
          <h2 style="margin-top: 0">📝 Этап 3: Комментарий</h2>
          <p style="margin-bottom: 15px">Перечень отправленных товаров:</p>
          <div id="commentsContainer"></div>
          <textarea id="commentsText" placeholder="Добавьте комментарий к отправке (опционально)" style="height: 200px; background: white"></textarea>
          <div class="button-group" style="margin-top: 15px">
            <button onclick="inventManager.backToEdit()" style="background: var(--accent-color); flex: 1">
              ← Вернуться к таблице
            </button>
          </div>
        </section>

        <div class="footer-link">
          <a href="/">← Вернуться на Этап 1</a>
        </div>
      </main>
    </div>

    <!-- Modal для добавления товара -->
    <div id="addProductModal" class="modal">
      <div class="modal-content">
        <div class="modal-title">➕ Добавить товар</div>
        <input 
          type="text" 
          id="searchInput" 
          class="modal-input" 
          placeholder="Поиск по названию или SKU..."
          oninput="inventManager.searchProducts()"
        />
        <div id="productSearchResults" style="max-height: 300px; overflow-y: auto; margin: 10px 0; border: 1px solid var(--border-color); border-radius: 4px; display: none"></div>
        <div style="margin-top: 10px; text-align: center; display: none" id="searchLoading">
          <span style="color: var(--gray-color)">⏳ Загрузка...</span>
        </div>
        <div id="selectedProductInfo" style="background: var(--light-color); padding: 10px; border-radius: 4px; margin: 10px 0; display: none">
          <div><strong id="selectedProductName"></strong></div>
          <div style="font-size: 12px; color: var(--gray-color)">SKU: <span id="selectedProductSku"></span></div>
          <div style="font-size: 12px; color: var(--gray-color)">На сервере: <span id="selectedProductQty"></span></div>
          <label style="margin-top: 10px; display: block">
            Количество для добавления:
            <input 
              type="number" 
              id="addProductQty" 
              class="modal-input" 
              value="1" 
              min="0"
              step="0.1"
              style="margin-top: 5px"
            />
          </label>
        </div>
        <div class="modal-buttons">
          <button onclick="inventManager.closeAddProductModal()" style="background: var(--accent-color)">Отмена</button>
          <button onclick="inventManager.addSelectedProduct()" id="btnAddToTable" style="background: var(--success-color); color: white; display: none">Добавить товар</button>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='js/invent.js') }}?t={{ range(1000000, 9999999) | random }}"></script>
  </body>
</html>
